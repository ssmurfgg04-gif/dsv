[package]
name = "dsv"
version = "0.13.2"
authors = ["dsv contributors", "Andrew Gallant <jamslam@gmail.com>"]
description = "dsv (Data Swiss Knife) — a high-performance CSV, Parquet, and JSONL CLI toolkit. Modern xsv fork with all 33 community PRs merged."
homepage = "https://github.com/ssmurfgg04-gif/dsv"
documentation = "https://docs.rs/dsv"
repository = "https://github.com/ssmurfgg04-gif/dsv"
readme = "README.md"
keywords = ["csv", "tsv", "parquet", "jsonl", "xsv"]
categories = ["command-line-utilities", "data-structures"]
license = "Unlicense/MIT"
autotests = false
edition = "2021"
rust-version = "1.85"
exclude = ["ci", "session.vim", "Makefile", "scripts", ".cargo"]

[[bin]]
name = "dsv"
test = false
bench = false
doctest = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/dsv-{ target }{ binary-ext }"
pkg-fmt = "bin"

[[test]]
name = "tests"

[features]
default = ["parquet", "jsonl"]
parquet = ["dep:parquet", "dep:arrow"]
jsonl = ["dep:serde_json"]

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
lto = "fat"
codegen-units = 1

[profile.test]
opt-level = 0

[dependencies]
anyhow = "1"
byteorder = "1"
crossbeam-channel = "0.5"
csv = "1.3"
csv-index = "0.1"
filetime = "0.2"
flate2 = "1"
num_cpus = "1.16"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
streaming-stats = "0.2"
tabwriter = "1"
threadpool = "1.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

parquet = { version = "53", optional = true, default-features = false, features = ["arrow"] }
arrow = { version = "53", optional = true, default-features = false }
serde_json = { version = "1", optional = true }

[dev-dependencies]
quickcheck = { version = "1", default-features = false }
log = "0.4"
